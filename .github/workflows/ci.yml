name: Validate module

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Import Pester
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.0 -ErrorAction Stop
          Get-Module Pester | Select-Object Name, Version, Path | Format-List

      - name: Validate manifest and command surface
        shell: powershell
        run: .\scripts\Validate-Module.ps1

      - name: Run Pester tests
        shell: powershell
        run: Invoke-Pester -Path .\tests -CI
