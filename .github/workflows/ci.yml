name: Validate module

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.0 -ErrorAction Stop
          Get-Module Pester | Select-Object Name, Version, Path | Format-List

      - name: Validate manifest and command surface
        shell: powershell
        run: .\scripts\Validate-Module.ps1

      - name: Run Pester tests
        shell: powershell
        run: |
          Import-Module Pester -RequiredVersion 5.9.0 -ErrorAction Stop
          Invoke-Pester -Path .\tests -CI
